<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Municipios - SAJG</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .search-box {
            width: 100%;
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #667eea;
            border-radius: 5px;
            outline: none;
        }

        .search-box:focus {
            border-color: #764ba2;
        }

        .table-container {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9em;
            letter-spacing: 0.5px;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        tbody tr {
            transition: background-color 0.3s;
        }

        tbody tr:hover {
            background-color: #f8f9ff;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }

        .error {
            background: #ff4444;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .count {
            color: white;
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📍 Lista de Municipios</h1>
        
        <div id="error-message" class="error" style="display: none;"></div>
        
        <div class="controls">
            <input type="text" 
                   id="search" 
                   class="search-box" 
                   placeholder="Buscar municipio...">
        </div>

        <div id="count" class="count"></div>

        <div id="loading" class="loading">Cargando datos...</div>

        <div id="table-container" class="table-container" style="display: none;">
            <table>
                <thead>
                    <tr id="table-header"></tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        let municipiosData = [];
        let filteredData = [];

        // Cargar datos al iniciar
        async function loadMunicipios() {
            try {
                const response = await fetch('http://localhost:3000/api/municipios');
                const result = await response.json();

                if (result.success) {
                    municipiosData = result.data;
                    filteredData = municipiosData;
                    renderTable(filteredData);
                    updateCount(filteredData.length, municipiosData.length);
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('table-container').style.display = 'block';
                } else {
                    showError('Error al cargar los datos: ' + result.error);
                }
            } catch (error) {
                showError('Error de conexión: ' + error.message);
            }
        }

        // Renderizar tabla
        function renderTable(data) {
            const tableHeader = document.getElementById('table-header');
            const tableBody = document.getElementById('table-body');

            // Limpiar tabla
            tableHeader.innerHTML = '';
            tableBody.innerHTML = '';

            if (data.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="100" class="no-results">No se encontraron resultados</td></tr>';
                return;
            }

            // Crear encabezados
            const headers = Object.keys(data[0]);
            headers.forEach(header => {
                const th = document.createElement('th');
                th.textContent = header;
                tableHeader.appendChild(th);
            });

            // Crear filas
            data.forEach(row => {
                const tr = document.createElement('tr');
                headers.forEach(header => {
                    const td = document.createElement('td');
                    td.textContent = row[header];
                    tr.appendChild(td);
                });
                tableBody.appendChild(tr);
            });
        }

        // Búsqueda
        document.getElementById('search').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            
            filteredData = municipiosData.filter(row => {
                return Object.values(row).some(value => 
                    String(value).toLowerCase().includes(searchTerm)
                );
            });

            renderTable(filteredData);
            updateCount(filteredData.length, municipiosData.length);
        });

        // Actualizar contador
        function updateCount(filtered, total) {
            const countElement = document.getElementById('count');
            if (filtered === total) {
                countElement.textContent = `Total: ${total} municipios`;
            } else {
                countElement.textContent = `Mostrando ${filtered} de ${total} municipios`;
            }
        }

        // Mostrar error
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('loading').style.display = 'none';
        }

        // Iniciar
        loadMunicipios();
    </script>
</body>
</html>
