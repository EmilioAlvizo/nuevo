<div class="contenedor">
  <div class="row text-wrap text-break">
    <div class="col-sm-12 col-md-12 col-xs-12 col-lg-12">
      <p class="text-center texto-title-pages mb-4">Voces Emergentes</p>
    </div>
  </div>

<div class="detalle-container" *ngIf="revista">
    <h1>Volumen {{ revista.volumen }} — Año {{ revista.numero_year }}</h1>
    <p class="fecha">{{ revista.fecha | date:'longDate' }}</p>
    
    <div class="flipbook-wrapper">
        <app-flipbook [src]="publicUrl+'/revistas/' + revista.id_revista + '/archivo/' + revista.archivo" [pageWidth]="900"></app-flipbook>


        <div class="card-layer with-image" [style.background-image]="'url('+publicUrl+'/revistas/' + revista.id_revista + '/portada/' + revista.portada + ')'">


        </div>
    </div>

    <p class="descripcion">{{ revista.descripcion }}</p>

    <button class="btn-descargar" (click)="descargarPDF()">
        Descargar PDF completo
    </button>

    <!-- Artículos -->
    <div *ngIf="articulos.length > 0" class="articulos-list">
      <h2 class="titulo-articulos">Artículos de la revista</h2>

      <div *ngFor="let articulo of articulos" class="articulo-card">
        <h3>{{ articulo.titulo }}</h3>
        <p class="autor"><strong>Autor:</strong> {{ articulo.autor }}</p>
        <p class="contenido">{{ articulo.contenido | slice:0:200 }}...</p>
        <button class="btn-leer">Leer más</button>
      </div>
    </div>

</div>
