<!-- temas-interes.component.html -->
<div class="temas-container">
    <div class="row text-wrap text-break">
    <div class="col-sm-12 col-md-12 col-xs-12 col-lg-12">
        <p class="text-center texto-title-pages mb-4">Temas de interés</p>
    </div>
    </div>

    <div class="header">
    <p class="subtitle">Descubre nuestros recursos más populares</p>
    </div>

  <!-- Loading State -->
  <div class="cards-grid" *ngIf="loading()">
    <p-card *ngFor="let item of [1,2,3,4]" class="tema-card">
      <div class="card-image-skeleton">
        <p-skeleton width="100%" height="12rem"></p-skeleton>
      </div>
      <div class="card-content-skeleton">
        <p-skeleton width="60%" height="1.5rem" styleClass="mb-2"></p-skeleton>
        <p-skeleton width="100%" height="1rem"></p-skeleton>
        <p-skeleton width="80%" height="1rem" styleClass="mt-2"></p-skeleton>
      </div>
    </p-card>
  </div>

  <!-- Error State -->
  <div class="error-message" *ngIf="error() && !loading()">
    <i class="pi pi-exclamation-triangle"></i>
    <p>{{ error() }}</p>
    <p-button 
      label="Reintentar" 
      icon="pi pi-refresh" 
      (onClick)="loadTemas()"
      styleClass="p-button-outlined">
    </p-button>
  </div>

  <!-- Cards Grid -->
  <div class="cards-grid" *ngIf="!loading() && !error() && temas().length > 0">
    <p-card 
      *ngFor="let tema of temas()" 
      class="tema-card"
      [styleClass]="'hover-card'">
      
      <ng-template pTemplate="header">
        <div class="card-image-container">
            <img 
            [src]="getImageUrl(tema.id_tema, tema.imagen)" 
            [alt]="tema.descripcionTema"
            (error)="onImageError($event)"
            class="card-image">
          <div class="card-overlay"></div>
          <div class="card-icon">
            <i class="pi pi-link"></i>
          </div>
        </div>
      </ng-template>

      <div class="card-body">
        <h3 class="card-title">{{ tema.descripcionTema }}</h3>
        <p class="card-description">{{ tema.descripcionMas }}</p>
      </div>

      <ng-template pTemplate="footer">
        <p-button 
          label="Ver más" 
          icon="pi pi-arrow-right"
          iconPos="right"
          [outlined]="true"
          (onClick)="navigateToLink(tema.link)"
          styleClass="w-full view-more-btn">
        </p-button>
      </ng-template>
    </p-card>
  </div>

  <!-- Empty State -->
  <div class="empty-state" *ngIf="!loading() && !error() && temas().length === 0">
    <i class="pi pi-inbox"></i>
    <p>No hay temas de interés disponibles en este momento</p>
  </div>
</div>
