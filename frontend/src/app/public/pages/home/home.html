<!-- nuevo/frontend/src/app/public/pages/home/home.html -->
<p-toast />

<div class="container">
  <div style="height: 100px"></div>
  <!-- Sección 1: Vídeo -->
  <section class="home-section mb-4">
    <div class="video-container">
      <video controls width="100%" style="border-radius: 20px">
        <source
          src="https://juventudesgto.guanajuato.gob.mx/files/archivos_excedidos/Juventudes_Estrategia.mp4"
          type="video/mp4"
        />
        Tu navegador no soporta el elemento de video
      </video>
    </div>
  </section>

  <!-- Sección 2: Testimonios -->
  <app-carrusel-testimonios *ngIf="isBrowser" [testimonios]="testimonios" [publicUrl]="publicUrl">
  </app-carrusel-testimonios>

  <div
    class="p-4 col-lg-3 col-md-4 col-sm-12 col-xs-12 col-fixed text-center espacio-25 justify-content-center"
  >
    <div class="p-4 bg-light rounded">
      <h5>¿Quieres compartir tu experiencia?</h5>
      <button class="btn btn-primary mt-2" (click)="abrirDialogo()">Deja tu testimonio</button>
    </div>
  </div>

  <!-- Modal agregar testimonio -->

  <app-form-testimonios
    [visible]="showDialog"
    (visibleChange)="showDialog = $event"
    (save)="guardarTestimonio($event)"
  />

  <app-encuesta-actual></app-encuesta-actual>

  <!-- Sección 3: Encuestas -->
  <section class="home-section mb-4">
    <div class="row">
      <div class="col-md-6 mb-3 mb-md-0">
        <div class="p-4 bg-light rounded h-100 d-flex flex-column justify-content-center">
          <h5>¿Qué tema te interesa más?</h5>
          <form>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="encuesta" id="opcion1" />
              <label class="form-check-label" for="opcion1">Educación</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="encuesta" id="opcion2" />
              <label class="form-check-label" for="opcion2">Empleo</label>
            </div>
            <button class="btn btn-primary mt-3">Votar</button>
          </form>
        </div>
      </div>
      <div class="col-md-6">
        <div class="p-4 bg-light rounded h-100 d-flex flex-column justify-content-center">
          <h5>Resultados</h5>
          <!-- Aquí va el gráfico, puedes usar una imagen o integrar una librería de gráficos -->
          <img
            src="{{ publicUrl }}/provisionales/grafica.png"
            alt="Gráfico de resultados"
            class="img-fluid"
          />
        </div>
      </div>
    </div>
  </section>

  <!-- Sección 4: Temas de interés -->
  <section class="home-section mb-4">
    <div class="row align-items-center justify-content-center">
      <!-- Columna izquierda -->
      <div
        class="col-lg-3 col-md-4 col-sm-12 text-center mb-3 mb-md-0 espacio-25 justify-content-center"
      >
        <div class="p-4 bg-light rounded h-100 d-flex flex-column justify-content-center">
          <h5>¿Quieres proponer una acción o estrategia en favor de las juventudes?</h5>
          <p-button label="Regístrala aquí" severity="success" (onClick)="abrirDialogoPropuesta()" />
        </div>
      </div>

      <!-- Columna derecha: Carrusel -->
      <div class="col-lg-9 col-md-8 col-sm-12 carrusel-espacio">
        <div id="temasCarousel" class="carousel slide h-100" data-bs-ride="carousel">
          <div class="carousel-inner">
            @for (t of temas; track t.id_tema; let i = $index) {
            <div class="carousel-item" [class.active]="i === 0">
              <div class="tema-item card border-0 h-100">
                <div class="row g-0 align-items-center">
                  <div class="col-md-5 text-center p-3">
                    <div class="tema-img-container">
                      <img
                        class="img-fluid tema-img rounded"
                        [src]="`${publicUrl}/temas_interes/${t.id_tema}/${t.imagen}`"
                        [alt]="t.descripcionTema"
                      />
                    </div>
                  </div>
                  <div class="col-md-7 d-flex flex-column justify-content-center p-4">
                    <h5 class="fw-bold text-primary">{{ t.descripcionTema }}</h5>
                    <p class="text-muted text-justify mb-3">
                      {{ t.descripcionMas }}
                    </p>
                    <a
                      [href]="t.link"
                      target="_blank"
                      rel="noopener noreferrer"
                      class="btn btn-outline-primary align-self-start"
                    >
                      Ver más
                    </a>
                  </div>
                </div>
              </div>
            </div>
            }
          </div>

          <!-- Controles -->
          <button
            class="carousel-control-prev"
            type="button"
            data-bs-target="#temasCarousel"
            data-bs-slide="prev"
          >
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Anterior</span>
          </button>
          <button
            class="carousel-control-next"
            type="button"
            data-bs-target="#temasCarousel"
            data-bs-slide="next"
          >
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Siguiente</span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <app-form-propuesta [visible]="showPropuesta" (visibleChange)="showPropuesta = $event" />
</div>
