  <!-- Sección 2: Testimonios -->
  <section class="home-section mb-4">
    <app-carrusel-testimonios [testimonios]="testimonios()" [publicUrl]="publicUrl">
    </app-carrusel-testimonios>

    <div
      class="p-4 col-lg-3 col-md-4 col-sm-12 col-xs-12 col-fixed text-center espacio-25 justify-content-center"
      pAnimateOnScroll
      enterClass="animate-fade-in animate-slide-up animate-duration-1000"
      once="true"
    >
      <div class="p-4 bg-light rounded">
        <h5>¿Quieres compartir tu experiencia?</h5>
        <button class="btn btn-primary mt-2" (click)="showDialog.set(true)">
          Deja tu testimonio
        </button>
      </div>
    </div>

    <app-form-testimonios
      [visible]="showDialog()"
      (visibleChange)="showDialog.set($event)"
      (save)="guardarTestimonio($event)"
    />
  </section>

  <!-- Sección 3: Encuestas -->
  @defer (hydrate on viewport) {
  <section class="home-section-1 p-5">
    <div
      class="container"
      pAnimateOnScroll
      enterClass="animate-fade-in animate-slide-up"
      once="true"
    >
      <app-encuesta-actual></app-encuesta-actual>
    </div>
  </section>
  } @placeholder {
  <div>Large component placeholder Encuestas</div>
  }

  <!-- Sección 4: Temas de interés -->
  <section class="home-section mb-4 container">
    <div class="row align-items-center justify-content-center">
      <div
        class="col-lg-3 col-md-4 col-sm-12 text-center mb-3 mb-md-0 espacio-25 justify-content-center"
      >
        <div class="p-4 bg-light rounded h-100 d-flex flex-column justify-content-center">
          <h5>¿Quieres proponer una acción o estrategia en favor de las juventudes?</h5>
          <!-- <p-button

        </div>
      </div>

    </div>
  </section>
