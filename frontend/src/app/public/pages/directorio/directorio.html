<!-- directorios.component.html -->
<div class="directorios-container">
  <!-- Header -->
  <!-- <div class="directorios-header">
    <h1 class="main-title">Directorios</h1>
    <p class="subtitle">Explora nuestros recursos digitales</p>
  </div> -->

  <div class="row text-wrap text-break">
    <div class="col-sm-12 col-md-12 col-xs-12 col-lg-12">
      <p class="text-center texto-title-pages mb-4">Directorios</p>
    </div>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading()" class="loading-container">
    <div class="spinner"></div>
    <p>Cargando directorios...</p>
  </div>

  <!-- Cards Grid -->
  <div *ngIf="!loading()" class="cards-grid">
  <div *ngFor="let directorio of directorios(); let i = index"
      class="card-wrapper"
      (click)="abrirDirectorio(directorio)">
      <div class="card-inner">
        <!-- Gradient Background -->
        <div class="card-gradient"></div>
        
        <!-- Border Frame -->
        <div class="card-frame"></div>
        
        <!-- Content -->
        <div class="card-content">
          <div class="title-wrapper">
            <h2 class="card-title">{{ directorio.descripcion }}</h2>
            <div class="title-divider"></div>
            <p class="card-subtitle">{{ directorio.descripcionMas }}</p>
          </div>
          
          <!-- Click hint -->
          <div class="click-hint">
            <span>Explorar</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </div>
        </div>

        <!-- Corner Accent -->
        <div class="corner-accent"></div>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="!loading() && directorios().length === 0" class="empty-state">
    <p>No hay directorios disponibles en este momento.</p>
  </div>
</div>
