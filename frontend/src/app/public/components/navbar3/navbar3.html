<!-- Header principal con forma Banamex -->
<header class="cmp-navbar" [class.scrolled]="isScrolled()">
  <nav class="cmp-navbar-nav">
    <!-- Logo/Brand -->
    <figure class="cmp-navbar-brand">
      <a [routerLink]="brandLink()">
        <img navbar-brand src="{{ publicUrl }}/assets/logo_1.png" alt="Logo" />
      </a>
    </figure>

    <!-- Navegación central (enlaces principales) -->
    <div class="nav-center" [class.mobile-open]="mobileMenuOpen()">
      <div class="nav-dropdown">
        <button
          class="nav-item-btn"
          [class.active]="dropdownOpen()"
          (click)="toggleDropdown($event)"
          type="button"
        >
          Sistema Juventudes
        </button>
        <div class="dropdown-content" [class.active]="dropdownOpen()">
          <div class="dropdown-item"><div class="dropdown-item-title">¿Qué es?</div></div>
          <div class="dropdown-item">
            <a routerLink="/directorio" routerLinkActive="active" class="dropdown-item-title">Consejo Estatal de la Juventud</a>
          </div>
          <div class="dropdown-item">
            <div class="dropdown-item-title">Red de investigadores</div>
      >
          </div>
        </div>
      </div>
      <a class="boton-rutas" routerLink="/estadisticas" routerLinkActive="active">Estadísticas</a>
      <a class="boton-rutas" routerLink="/revista" routerLinkActive="active"
        >Revista Voces Emergentes</a
      >
      <a class="boton-rutas" routerLink="/centro-documental" routerLinkActive="active"
        >Centro Documental</a
      >
      <a class="boton-rutas" routerLink="/informacion-interes" routerLinkActive="active"
        >Información de interés</a
      >
    </div>
    <!-- Navegación derecha (acciones) -->
    <!-- <div class="nav-right">
      <a routerLink="/login" class="btn-login">Login</a>
    </div> -->
    <!-- Botón hamburguesa -->
    <span class="cmp-navbar-burguer">
      <button
        class="cmp-navbar-burguer-button"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="mobileMenuOpen()"
        aria-label="Toggle navigation menu"
        type="button"
      >
        <svg viewBox="0 -20 360 360" class="branding-module" aria-hidden="true">
          <path
            d="M180 0C258.633 0 299.079 8.70396 324.243 31.0624C353.916 57.4174 360 102.476 360 162C360 221.533 353.925 266.583 324.243 292.938C299.079 315.287 258.633 324 180 324C101.367 324 60.921 315.296 35.757 292.938C6.084 266.583 0 221.533 0 162C0 102.467 6.084 57.4174 35.757 31.0624C60.921 8.71297 101.367 0 180 0Z"
          ></path>
        </svg>
        <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24">
          @if (mobileMenuOpen()) {
          <path
            fill="currentColor"
            d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
          />
          } @else {
          <path fill="currentColor" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
          }
        </svg>
      </button>
    </span>
    <div class="cmp-navbar-nav-backdrop"></div>
  </nav>
  <div
    class="cmp-navbar-backdrop with-event"
    (click)="closeMenu()"
    [class.active]="mobileMenuOpen()"
  ></div>
</header>
