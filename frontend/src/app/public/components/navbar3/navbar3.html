<!-- nuevo/frontend/src/app/public/components/navbar3/navbar3.html -->
<!-- Barra informativa superior -->
<app-top-bar [show]="showTopBar()" (expandedChange)="onTopBarExpanded($event)"></app-top-bar>

<!-- Header principal -->
<header class="cmp-navbar" [class.scrolled]="isScrolled()">
  <nav class="cmp-navbar-nav">
    <!-- Logo/Brand -->
    <figure class="cmp-navbar-brand">
      <a [routerLink]="brandLink()" (click)="onLinkClick()">
        <img navbar-brand ngSrc="{{publicUrl}}/assets/logo_1.png" alt="Logo" width="120" height="40"/>
      </a>
    </figure>

    <!-- Navegación central (enlaces principales) -->
    <div class="nav-center" [class.mobile-open]="mobileMenuOpen()">

      <!-- Dropdown Sistema Juventudes -->
      <div class="nav-dropdown">
        <button
          class="nav-item-btn"
          [class.active]="isOpen('juventudes') || isDropdownActive('juventudes')"
          (click)="toggleDropdown('juventudes', $event)"
          type="button"
          aria-expanded="{{ isOpen('juventudes') }}"
        >
          <span>Sistema Juventudes</span>
          <i  [class.rotated]="isOpen('juventudes')"></i>
        </button>
        <div class="dropdown-content" [class.active]="isOpen('juventudes')">
          <div class="dropdown-item">
            <a
              routerLink="/sistema"
              routerLinkActive="active"
              class="dropdown-item-title"
              (click)="onLinkClick()">
              ¿Qué es?
            </a>
          </div>
          <div class="dropdown-item">
            <a 
              routerLink="/consejo" 
              routerLinkActive="active" 
              class="dropdown-item-title"
              (click)="onLinkClick()">
              Consejo Estatal de la Juventud
            </a>
          </div>
          <div class="dropdown-item">
            <div class="dropdown-item-title">Red de investigadores</div>
          </div>
        </div>
      </div>

      <!-- Enlaces principales -->
      <a 
        class="boton-rutas" 
        routerLink="/estadisticas" 
        routerLinkActive="active"
        (click)="onLinkClick()">
        Estadísticas
      </a>
      <a 
        class="boton-rutas" 
        routerLink="/revista" 
        routerLinkActive="active"
        (click)="onLinkClick()">
        Revista Voces Emergentes
      </a>
      <a 
        class="boton-rutas" 
        routerLink="/centro-documental" 
        routerLinkActive="active"
        (click)="onLinkClick()">
        Centro Documental
      </a>

      <!-- Dropdown Información de interés -->
      <div class="nav-dropdown">
        <button
          class="nav-item-btn"
          [class.active]="isOpen('informacion') || isDropdownActive('informacion')"
          (click)="toggleDropdown('informacion', $event)"
          type="button"
          aria-expanded="{{ isOpen('informacion') }}"
        >
          <span>Información de interés</span>
          <i  [class.rotated]="isOpen('informacion')"></i>
        </button>
        <div class="dropdown-content" [class.active]="isOpen('informacion')">
          <div class="dropdown-item">
            <div class="dropdown-item-title">Apoyos y servicios</div>
          </div>
          <div class="dropdown-item">
            <a 
              routerLink="/" 
              routerLinkActive="active" 
              class="dropdown-item-title"
              (click)="onLinkClick()">
              Directorios
            </a>
          </div>
          <div class="dropdown-item">
            <div class="dropdown-item-title">Temas de interés</div>
          </div>
        </div>
      </div>

    </div>

    <!-- Botón hamburguesa -->
    <span class="cmp-navbar-burguer">
      <button
        class="cmp-navbar-burguer-button"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="mobileMenuOpen()"
        [attr.aria-label]="mobileMenuOpen() ? 'Cerrar menú' : 'Abrir menú'"
        type="button"
      >
        <svg viewBox="0 -20 360 360" class="branding-module" aria-hidden="true">
          <path
            d="M180 0C258.633 0 299.079 8.70396 324.243 31.0624C353.916 57.4174 360 102.476 360 162C360 221.533 353.925 266.583 324.243 292.938C299.079 315.287 258.633 324 180 324C101.367 324 60.921 315.296 35.757 292.938C6.084 266.583 0 221.533 0 162C0 102.467 6.084 57.4174 35.757 31.0624C60.921 8.71297 101.367 0 180 0Z"
          ></path>
        </svg>
        <!-- Ícono animado -->
        <div class="hamburger-icon" [class.active]="mobileMenuOpen()">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </button>
    </span>
  </nav>

  <!-- Backdrop -->
  <div
    
    (click)="closeMenu()"
    [class.active]="mobileMenuOpen()"
  ></div>
</header>
