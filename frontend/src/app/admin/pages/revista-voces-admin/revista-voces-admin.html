<!-- /nuevo/frontend/src/app/admin/pages/revista-voces-admin/revista-voces-admin.html -->
<app-tabla-generica
  [dataService]="revistasService"
  [columns]="columns"
  [title]="'Gestión de Revistas'"
  [entityName]="'revista'"
  [showSelection]="false"
  [showViewButton]="true"
  [showEditButton]="true"
  [showDeleteButton]="true"
  (add)="agregar()"
  (edit)="editar($event)"
  (remove)="eliminar($event)"
  [refreshSignal]="refrescarTabla"
/>

<!-- Formulario de creación/edición -->
<app-form-revistas
  [visible]="showDialog()"
  [revistaToEdit]="revistaToEdit"
  [isEditMode]="!!revistaToEdit"
  (save)="guardarRevista($event)"
  (visibleChange)="showDialog.set($event)"
></app-form-revistas>

<!-- mensajes -->
<p-confirmDialog [style]="{ width: '450px' }" [baseZIndex]="10000" />
<p-toast />
