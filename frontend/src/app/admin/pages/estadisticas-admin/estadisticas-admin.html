<div class="card">
  <p-menubar [model]="items" breakpoint="300px"></p-menubar>
</div>

<div class="mt-4">
  @switch (selectedTable()) { 
    @case ('archMunicipios'){
  <app-tabla-arch-municipios></app-tabla-arch-municipios>
  } @case ('a'){
  <app-tabla-a></app-tabla-a>
  } @case ('docCendoc'){
  <app-tabla-doc-cendoc></app-tabla-doc-cendoc>
  } @default{
  <div>Welcome, Guest!</div>
  } }
</div>
