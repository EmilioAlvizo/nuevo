<app-tabla-generica
  [dataService]="documentosCendocService"
  [columns]="columns"
  [title]="'Gestión de Encuestas'"
  [entityName]="'documento'"
  [showSelection]="false"
  [showViewButton]="true"
  [showEditButton]="true"
  [showDeleteButton]="true"
  (add)="agregar()"
  (edit)="editar($event)"
  (remove)="eliminar($event)"
  (view)="ver($event)"
  [refreshSignal]="refrescarTabla"
/>

  [visible]="showDialog()"
  [isEditMode]="!!encuestaToEdit"
