<!-- nuevo/frontend/src/app/admin/shared/tabla-generica/tabla-generica.html -->
<div class="contenedor border-round border-1 surface-border shadow-2">
  <!-- 🔹 Toolbar principal -->
  <p-toolbar class="mb-4">
    <ng-template #start>
      <p-button 
        label="Nuevo" 
        icon="pi pi-plus" 
        class="me-2"
        (onClick)="add.emit()"
      />
      <p-button
        label="Eliminar seleccionados"
        icon="pi pi-trash"
        severity="danger"
        outlined
        (onClick)="removeSelected()"
        [disabled]="!hasSelectedItems()"
      />
    </ng-template>
  </p-toolbar>

  <p-table
    #dt
    [value]="data()"
    [lazy]="true"
    (onLazyLoad)="loadData($event)"
    [paginator]="true"
    [rows]="rows()"
    [totalRecords]="totalRecords()"
    [loading]="loading()"
    [scrollable]="true"
    scrollDirection="both"
    scrollHeight="auto"
    [resizableColumns]="true"
    [rowsPerPageOptions]="[10, 25, 50, 100]"
    [selection]="selectedItems()"
    dataKey="id"
    [style]="{ 'min-width': '100%', width: '100%' }"
  >
  <ng-template #caption>
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-3" >
        <h3 class="m-0">{{title()}}</h3>
        <div class="d-flex gap-2 align-items-center">
          <!-- Búsqueda Global -->
          <p-iconfield iconPosition="left">
            <p-inputicon>
              <i class="pi pi-search"></i>
            </p-inputicon>
            <input
              pInputText
              type="text"
              (input)="dt.filterGlobal($any($event.target).value, 'contains')"
              placeholder="Buscar..."
              class="w-100"
              style="min-width: 250px"
            />
          </p-iconfield>

          <p-button
            label="Limpiar Filtros"
            [outlined]="true"
            icon="pi pi-filter-slash"
            (click)="clearFilters()"
          />
        </div>
      </div>
    </ng-template>
    
    <ng-template #header>
      <tr>
        @if (selectable()) {
        <th><p-tableHeaderCheckbox /></th>
        } @for (col of columns(); track col.field) {
        <th
          [style]="{ width: col.width, 'max-width': col.width, 'min-width': col.width }"
          [pSortableColumn]="col.sortable ? col.field : undefined"
        >
          <div class="d-flex align-items-center justify-content-start gap-2">
            <span>{{ col.header }}</span>
            @if (col.sortable) {
            <p-sortIcon [field]="col.field" />} @if (col.filterable) {
            <p-columnFilter [field]="col.field" [type]="col.filterType || 'text'" display="menu">
            </p-columnFilter
            >}
          </div>
        </th>
        }
        <th style="width: 50px">Acciones</th>
      </tr>
    </ng-template>

    <ng-template #body let-row>
      <tr>
        @if (selectable()) {
        <td style="width: 20px"><p-tableCheckbox [value]="row" /></td>
        } @for (col of columns(); track col.field) {
        <td
          [style]="{
            width: col.width,
            'max-width': col.width,
            'min-width': col.width,
            'white-space': col.template ? 'normal' : 'nowrap',
            overflow: 'hidden',
            'text-overflow': col.template ? 'clip' : 'ellipsis'
          }"
          [innerHTML]="col.template ? col.template(row) : row[col.field]"
          [pTooltip]="col.tooltip !== false ? (!col.template ? row[col.field] : null) : null"
          tooltipPosition="top"
        ></td>
        }
        <td style="width: 50px">
          <div class="d-flex gap-2">
            <p-button icon="pi pi-eye" (click)="view.emit(row)" outlined pTooltip="Ver" />
            <p-button icon="pi pi-pencil" (click)="edit.emit(row)" outlined pTooltip="Modificar" />
            <p-button
              icon="pi pi-trash"
              (click)="remove.emit(row)"
              outlined
              severity="danger"
              pTooltip="Eliminar"
            />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td [attr.colspan]="columns().length + 1" class="text-center py-5">
          <i class="pi pi-inbox text-muted display-2"></i>
          <p>No se encontraron {{ entityName() }}s</p>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
