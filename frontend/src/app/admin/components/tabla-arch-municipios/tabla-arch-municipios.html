<app-tabla-generica
  [dataService]="apiArchivos_municipio"
  [columns]="columns()"
  [title]="'Archivos Municipios'"
  [entityName]="'documento'"
  [showSelection]="false"
  [showViewButton]="true"
  [showEditButton]="true"
  [showDeleteButton]="true"
  (add)="agregar()"
  (edit)="editar($event)"
  (view)="ver($event)"
  (remove)="eliminar($event)"
  [refreshSignal]="refrescarTabla"
/>
