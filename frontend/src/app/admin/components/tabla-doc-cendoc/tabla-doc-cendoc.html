<!-- // nuevo/frontend/src/app/admin/components/tabla-doc-cendoc/tabla-doc-cendoc.ts -->
<app-tabla-generica
  [dataService]="documentosCendocService"
  [columns]="columns"
  [title]="'Gestión de Documentos Cendoc'"
  [entityName]="'documento'"
  [showSelection]="false"
  [showViewButton]="true"
  [showEditButton]="true"
  [showDeleteButton]="true"
  (add)="agregar()"
  (edit)="editar($event)"
  (remove)="eliminar($event)"
  (view)="ver($event)"
  [refreshSignal]="refrescarTabla"
/>

<app-form-doc-cendoc
  [categorias]="categorias()"
  [visible]="showDialog()"
  [isEditMode]="!!revistaToEdit"
  [docToEdit]="revistaToEdit"
  (save)="guardar($event)"
  (visibleChange)="showDialog.set($event)"
/>

<!-- mensajes -->
<p-confirmDialog [style]="{ width: '450px' }" [baseZIndex]="10000" />
<p-toast />
